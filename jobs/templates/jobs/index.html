<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JobFit Tracker</title>
        <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            margin: 0;
            padding: 40px 16px;
            color: #222;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }
        h1 { margin-top: 0; color: #2b4eff; }
        textarea, input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            margin-bottom: 10px;
        }
        button {
            background: #2b4eff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }
        button:hover { background: #1a36c7; }

        .score { font-size: 28px; font-weight: bold; color: #2b4eff; margin: 16px 0 4px; }
        .tag {
            display: inline-block;
            padding: 4px 10px;
            margin: 3px;
            border-radius: 12px;
            font-size: 13px;
        }
        .have    { background: #d4f5dd; color: #136c2e; }
        .missing { background: #fde0e0; color: #a51c1c; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #eee; }
        th { background: #f0f2fa; }
        .status-APPLIED   { color: #2b4eff; font-weight: bold; }
        .status-INTERVIEW { color: #e08a00; font-weight: bold; }
        .status-OFFER     { color: #138a36; font-weight: bold; }
        .status-REJECTED  { color: #a51c1c; }

        select {
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-family: inherit;
        }
        .delete-btn {
            background: none;
            color: #a51c1c;
            padding: 4px 8px;
            font-size: 16px;
        }
        .delete-btn:hover { background: #fde0e0; }
    </style>
</head>
<body>
    <div class="container">
    <h1>JobFit Tracker</h1>
    <p>Paste a job posting and get an instant fit analysis.</p>

    <textarea id="posting" rows="10" cols="80"
              placeholder="Paste a job posting here..."></textarea>
    <br>
    <button id="analyze-btn">Analyze</button>

    <div id="result"></div>

    <h2>Save this job</h2>
    <input id="company" placeholder="Company">
    <input id="title" placeholder="Job title">
    <button id="save-btn">Save job</button>
    <p id="save-message"></p>

    <h2>My applications</h2>
    <table>
        <thead>
            <tr>
                <th>Company</th>
                <th>Title</th>
                <th>Location</th>
                <th>Fit</th>
                <th>Status</th>
                <th></th>               
            </tr>
        </thead>
        <tbody id="jobs-body"></tbody>
    </table>
    </div>

    <script>
    const button = document.getElementById("analyze-btn");

    button.addEventListener("click", async () => {
        const text = document.getElementById("posting").value;

        const response = await fetch("/api/analyze/", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text: text }),
        });

        const data = await response.json();

        const resultDiv = document.getElementById("result");    

        if (!response.ok) {
        resultDiv.innerHTML = `<p>Error: ${data.error}</p>`;
        return;
        }

        const tags = data.skills_found.map(skill =>
            data.skills_missing.includes(skill)
            ? `<span class="tag missing">${skill}</span>`
            : `<span class="tag have">${skill}</span>`
        ).join("");

        resultDiv.innerHTML = `
            <p class="score">${data.fit_score}% fit</p>
            <p>📍 ${data.location || "Unknown"} &nbsp; 💼 ${data.job_type || "Unknown"}</p>
            <div>${tags}</div>
        `;
    });
    const saveButton = document.getElementById("save-btn");

    saveButton.addEventListener("click", async () => {
        const company = document.getElementById("company").value;
        const title = document.getElementById("title").value;
        const description = document.getElementById("posting").value;

        const response = await fetch("/api/jobs/", {               
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                company: company,
                title: title,                                    
                description: description,                              
            }),
        });

        const data = await response.json();
        const message = document.getElementById("save-message");

        if (response.ok) {
            message.innerHTML = `Saved! Fit score: ${data.fit_score}%`;
            loadJobs();     
        } else {
            const errors = Object.values(data).flat().join(" ");
            message.innerHTML = `Error: ${errors}`;
        }
    });

    const STATUSES = ["SAVED", "APPLIED", "INTERVIEW", "REJECTED", "OFFER"];

    async function updateStatus(id, newStatus) {
        await fetch(`/api/jobs/${id}/`, {
            method: "PATCH",                                   
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ status: newStatus }),
        });
        loadJobs();
    }

    async function deleteJob(id) {
        if (!confirm("Delete this job?")) {
            return;
        }
        await fetch(`/api/jobs/${id}/`, { method: "DELETE" });  
        loadJobs();
    }

    async function loadJobs() {
        const response = await fetch("/api/jobs/");     
        const jobs = await response.json();               

        const tbody = document.getElementById("jobs-body");
        tbody.innerHTML = "";                             

        for (const job of jobs) {
            tbody.innerHTML += `
                <tr>
                    <td>${job.company}</td>
                    <td>${job.title}</td>
                    <td>${job.location}</td>
                    <td>${job.fit_score !== null ? job.fit_score + "%" : "-"}</td>
                    <td>
                        <select class="status-${job.status}" onchange="updateStatus(${job.id}, this.value)">
                            ${STATUSES.map(s =>
                                `<option value="${s}" ${s === job.status ? "selected" : ""}>${s}</option>`
                            ).join("")}
                        </select>
                    </td>
                    <td><button class="delete-btn" onclick="deleteJob(${job.id})">🗑</button></td>
                </tr>
            `;
        }
    }

    loadJobs();    
</script>
</body>
</html>
