<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JobFit Tracker</title>
</head>
<body>
    <h1>JobFit Tracker</h1>
    <p>Paste a job posting and get an instant fit analysis.</p>

    <textarea id="posting" rows="10" cols="80"
              placeholder="Paste a job posting here..."></textarea>
    <br>
    <button id="analyze-btn">Analyze</button>

    <div id="result"></div>

    <h2>Save this job</h2>
    <input id="company" placeholder="Company">
    <input id="title" placeholder="Job title">
    <button id="save-btn">Save job</button>
    <p id="save-message"></p>

    <h2>My applications</h2>
    <table border="1">
        <thead>
            <tr>
                <th>Company</th>
                <th>Title</th>
                <th>Location</th>
                <th>Fit</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="jobs-body"></tbody>
    </table>

    <script>
    const button = document.getElementById("analyze-btn");

    button.addEventListener("click", async () => {
        const text = document.getElementById("posting").value;

        const response = await fetch("/api/analyze/", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text: text }),
        });

        const data = await response.json();

        const resultDiv = document.getElementById("result");    

        if (!response.ok) {
            resultDiv.innerHTML = `<p>Error: ${data.error}</p>`;
            return;
        }

        resultDiv.innerHTML = `
            <p>Location: ${data.location}</p>
            <p>Job type: ${data.job_type}</p>
            <p>Fit score: ${data.fit_score}%</p>
            <p>Skills found: ${data.skills_found.join(", ")}</p>
            <p>Skills missing: ${data.skills_missing.join(", ")}</p>
        `;
    });

    const saveButton = document.getElementById("save-btn");

    saveButton.addEventListener("click", async () => {
        const company = document.getElementById("company").value;
        const title = document.getElementById("title").value;
        const description = document.getElementById("posting").value;

        const response = await fetch("/api/jobs/", {               
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                company: company,
                title: title,                                    
                description: description,                              
            }),
        });

        const data = await response.json();
        const message = document.getElementById("save-message");

        if (response.ok) {
            message.innerHTML = `Saved! Fit score: ${data.fit_score}%`;
            loadJobs();     
        } else {
            const errors = Object.values(data).flat().join(" ");
            message.innerHTML = `Error: ${errors}`;
        }
    });

    async function loadJobs() {
        const response = await fetch("/api/jobs/");     
        const jobs = await response.json();               

        const tbody = document.getElementById("jobs-body");
        tbody.innerHTML = "";                             

        for (const job of jobs) {
            tbody.innerHTML += `
                <tr>
                    <td>${job.company}</td>
                    <td>${job.title}</td>
                    <td>${job.location}</td>
                    <td>${job.fit_score !== null ? job.fit_score + "%" : "-"}</td>
                    <td>${job.status}</td>
                </tr>
            `;
        }
    }

    loadJobs();    
</script>
</body>
</html>
